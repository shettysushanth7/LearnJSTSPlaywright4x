<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">JavaScript operators</title>
  <desc id="desc">Five operator groups: assignment, arithmetic, comparison, logical, and conditional.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <text x="48" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="700">JavaScript operators</text>
  <text x="48" y="88" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">Operators transform values into assignments, results, and decisions</text>
  <g font-family="Arial, sans-serif">
    <rect x="48" y="122" width="204" height="126" rx="16" fill="#1d4ed8" fill-opacity=".22" stroke="#60a5fa"/>
    <text x="72" y="158" fill="#bfdbfe" font-size="17" font-weight="700">ASSIGN</text>
    <text x="72" y="203" fill="#f8fafc" font-family="Menlo, Consolas, monospace" font-size="25">x += 2</text>
    <rect x="274" y="122" width="204" height="126" rx="16" fill="#7e22ce" fill-opacity=".2" stroke="#c084fc"/>
    <text x="298" y="158" fill="#e9d5ff" font-size="17" font-weight="700">CALCULATE</text>
    <text x="298" y="203" fill="#f8fafc" font-family="Menlo, Consolas, monospace" font-size="25">a * b</text>
    <rect x="500" y="122" width="204" height="126" rx="16" fill="#047857" fill-opacity=".22" stroke="#34d399"/>
    <text x="524" y="158" fill="#a7f3d0" font-size="17" font-weight="700">COMPARE</text>
    <text x="524" y="203" fill="#f8fafc" font-family="Menlo, Consolas, monospace" font-size="25">a === b</text>
    <rect x="726" y="122" width="204" height="126" rx="16" fill="#b45309" fill-opacity=".22" stroke="#fbbf24"/>
    <text x="750" y="158" fill="#fde68a" font-size="17" font-weight="700">COMBINE</text>
    <text x="750" y="203" fill="#f8fafc" font-family="Menlo, Consolas, monospace" font-size="25">ready &amp;&amp; ok</text>
    <rect x="952" y="122" width="204" height="126" rx="16" fill="#be123c" fill-opacity=".2" stroke="#fb7185"/>
    <text x="976" y="158" fill="#fecdd3" font-size="17" font-weight="700">CHOOSE</text>
    <text x="976" y="203" fill="#f8fafc" font-family="Menlo, Consolas, monospace" font-size="25">ok ? "Y" : "N"</text>
  </g>
</svg>
