<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Increment, decrement, and nullish coalescing</title>
  <desc id="desc">Prefix updates before yielding a value, postfix yields before updating, and nullish coalescing supplies a fallback for null or undefined.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <text x="48" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="700">Update values, then choose safe fallbacks</text>
  <text x="48" y="88" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">Prefix and postfix both change the variable; their yielded values differ</text>
  <g font-family="Arial, sans-serif">
    <rect x="48" y="120" width="330" height="132" rx="16" fill="#1d4ed8" fill-opacity=".22" stroke="#60a5fa"/>
    <text x="72" y="157" fill="#bfdbfe" font-size="17" font-weight="700">PREFIX</text>
    <text x="72" y="201" fill="#f8fafc" font-family="Menlo, Consolas, monospace" font-size="23">++x</text>
    <text x="154" y="201" fill="#93c5fd" font-family="Menlo, Consolas, monospace" font-size="16">update → yield new value</text>
    <rect x="400" y="120" width="330" height="132" rx="16" fill="#7e22ce" fill-opacity=".2" stroke="#c084fc"/>
    <text x="424" y="157" fill="#e9d5ff" font-size="17" font-weight="700">POSTFIX</text>
    <text x="424" y="201" fill="#f8fafc" font-family="Menlo, Consolas, monospace" font-size="23">x++</text>
    <text x="506" y="201" fill="#d8b4fe" font-family="Menlo, Consolas, monospace" font-size="16">yield old value → update</text>
    <rect x="752" y="120" width="400" height="132" rx="16" fill="#047857" fill-opacity=".22" stroke="#34d399"/>
    <text x="776" y="157" fill="#a7f3d0" font-size="17" font-weight="700">NULLISH FALLBACK</text>
    <text x="776" y="201" fill="#f8fafc" font-family="Menlo, Consolas, monospace" font-size="22">value ?? "default"</text>
    <text x="776" y="230" fill="#6ee7b7" font-size="15">fallback only for null or undefined</text>
  </g>
</svg>
